services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docker-practice-app:1.0
    ports:
      - "8080:8080"
    environment:
      STATIC_DIR: /app/static
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      # Подключаем страницу к Go-серверу только для чтения.
      - ./frontend:/app/static:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
